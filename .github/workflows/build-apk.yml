name: Build LEGENDS OS APK

# Runs when you push to main/master, or manually: Actions > Build LEGENDS OS APK > Run workflow.
on:
  workflow_dispatch:
  push:
    branches: [main, master]

# "contents: write" lets the last step attach the APK to a GitHub Release (easy download on a phone).
permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      # Works with BOTH layouts:
      #  1) extracted project files in the repo root (settings.gradle is there), or
      #  2) just the project .zip uploaded to the repo root (handy when using a phone browser).
      - name: Locate Android project
        id: locate
        shell: bash
        run: |
          set -e
          if [ -f settings.gradle ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
            echo "Using extracted project in the repository root."
            exit 0
          fi
          ZIP="$(ls -1 *.zip 2>/dev/null | head -n 1 || true)"
          if [ -z "$ZIP" ]; then
            echo "::error::No Android project found. Upload the project ZIP (or the extracted files) to the repository root."
            exit 1
          fi
          echo "Unpacking $ZIP"
          mkdir -p _project
          unzip -q -o "$ZIP" -d _project
          FOUND="$(find _project -maxdepth 3 -name settings.gradle | head -n 1)"
          if [ -z "$FOUND" ]; then
            echo "::error::settings.gradle not found inside $ZIP"
            exit 1
          fi
          echo "dir=$(dirname "$FOUND")" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

    name: Build LEGENDS OS APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LegendsOS-V32-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: ${{ steps.locate.outputs.dir }}
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Collect APK
        run: cp "${{ steps.locate.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk" LegendsOS-V32-debug.apk

      # Download from the run page (comes as a .zip containing the .apk)
      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: LegendsOS-V32-debug-APK
          path: LegendsOS-V32-debug.apk
          if-no-files-found: error

      # Direct .apk download from the repository's Releases page (no unzipping needed)
      - name: Publish APK to a GitHub Release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "debug-build-${{ github.run_number }}" LegendsOS-V32-debug.apk \
            --title "LEGENDS OS V32 debug build #${{ github.run_number }}" \
            --notes "Debug APK built by GitHub Actions from commit ${{ github.sha }}." \
            --prerelease \
            --target "${{ github.sha }}"
